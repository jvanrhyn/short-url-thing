version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d url_shortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=url_shortener;Username=shortener;Password=pass
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
